name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

# A newer run on the same ref makes an older one pointless, so cancel it.
# main is excluded: a run already in progress there is never cancelled.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run format:check
            - run: npm run typecheck
            - run: npx vitest run --exclude '**/live-*'
